<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Runs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   COACH SETTINGS — edit these, commit, and the plan rebuilds itself.
   ===================================================================== */
const COACH = {
  raceDate:   '2026-11-30',              // your half marathon (YYYY-MM-DD)
  targetTime: 'auto',                    // e.g. '1:59:00', or 'auto' = based on your recent runs
  runDays:    ['Tue', 'Thu', 'Sat', 'Sun'],
  longRunDay: 'Sun',
  planStart:  '2026-10-05',              // a Monday; don't change once you've started
};
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e4e2dc;
    --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --series: #2a78d6; --grid: #ecebe7;
    --good: #008300; --warn: #b26b00; --bad: #c4312f; --accent-bg: #e8f1fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2c2c2a;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
      --series: #3987e5; --grid: #2a2a28;
      --good: #4cbb4c; --warn: #e0a030; --bad: #e66767; --accent-bg: #16263a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  h2.section { font-size: 20px; margin: 36px 0 12px; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); font-size: 13px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  button { font: inherit; cursor: pointer; }
  .pill { border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .pill.on { background: var(--text); color: var(--surface); border-color: var(--text); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .tile .label { color: var(--text-2); font-size: 13px; }
  .tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: 14px; color: var(--text-2); font-weight: 400; margin-left: 2px; }
  .tile .hint { color: var(--muted); font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .chart { position: relative; height: 240px; }
  #map { height: 320px; border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-2); font-weight: 500; font-size: 13px; }
  td.num, th.num { text-align: right; }
  #rows tr { cursor: pointer; }
  #rows tr:hover, #rows tr.sel { background: var(--grid); }
  #rows tr.sel { font-weight: 600; }
  .scroll { overflow-x: auto; }
  .pb { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .pb div .label { color: var(--text-2); font-size: 13px; }
  .pb div .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pb div .when { color: var(--muted); font-size: 12px; }
  .msg { padding: 40px; text-align: center; color: var(--text-2); }

  /* coach */
  .today { border: 2px solid var(--series); }
  .today .kicker { color: var(--series); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .today .title { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; margin: 2px 0 4px; }
  .today .detail { color: var(--text-2); margin-bottom: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  .btn.primary { background: var(--series); border-color: var(--series); color: #fff; }
  .feel { display: flex; gap: 6px; flex-wrap: wrap; }
  .feel-label { color: var(--text-2); font-size: 13px; margin: 8px 0 6px; }
  .notes { margin: 0; padding: 0; list-style: none; }
  .notes li { padding: 10px 12px; border-radius: 8px; background: var(--accent-bg); margin-bottom: 8px; font-size: 14px; }
  .notes li b { font-weight: 600; }
  .adj { color: var(--warn); font-size: 13px; margin-top: 2px; white-space: normal; }
  .paces { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .paces span { background: var(--surface-2); border-radius: 6px; padding: 4px 8px; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .paces b { color: var(--text); font-weight: 600; }
  .next-row { display: grid; grid-template-columns: 88px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: start; }
  .next-row:last-child { border-bottom: 0; }
  .next-row .d { color: var(--text-2); font-size: 13px; }
  .next-row .t { font-weight: 600; }
  .next-row .x { color: var(--text-2); font-size: 13px; }
  .next-row .k { font-variant-numeric: tabular-nums; font-weight: 600; }
  details.week { border-bottom: 1px solid var(--border); }
  details.week:last-child { border-bottom: 0; }
  details.week summary { cursor: pointer; padding: 10px 0; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
  details.week summary::-webkit-details-marker { display: none; }
  details.week summary .w { font-weight: 600; }
  details.week summary .m { color: var(--text-2); font-size: 13px; }
  details.week table { margin-bottom: 10px; }
  details.week td { white-space: normal; vertical-align: top; }
  .st { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st.done { color: var(--good); } .st.missed { color: var(--bad); } .st.partial, .st.moved { color: var(--warn); }
  .st.planned, .st.rest { color: var(--muted); } .st.today { color: var(--series); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 760px) {
    .tiles, .pb { grid-template-columns: 1fr 1fr; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>My Runs</h1>
    <span class="sub" id="updated"></span>
  </header>

  <section id="coach"><div class="card msg">Loading your coach…</div></section>

  <h2 class="section">Your running</h2>
  <div class="filters" id="filters">
    <button class="pill" data-range="30">30 days</button>
    <button class="pill" data-range="90">90 days</button>
    <button class="pill on" data-range="365">12 months</button>
    <button class="pill" data-range="all">All time</button>
  </div>
  <div id="content"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let ALL = [], range = '365', charts = [], map;

/* ---------------- date + format helpers ---------------- */
const DAY = 864e5, DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffD = (a, b) => Math.round((pd(b) - pd(a)) / DAY);           // b minus a, in days
const dowOf = s => (pd(s).getDay() + 6) % 7;
const mondayOf = s => addD(s, -dowOf(s));
const r05 = x => Math.round(x * 2) / 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const hms = s => s.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
const fmtPace = s => { if (!isFinite(s)) return '–'; let m = Math.floor(s / 60), x = Math.round(s % 60); if (x === 60) { m++; x = 0; } return `${m}:${pad(x)}`; };
const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.round(s % 60); return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const fmtDate = d => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDay = s => pd(s).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const TODAY = (new URLSearchParams(location.search).get('today')) || ymd(new Date());  // ?today= for testing

/* ---------------- check-ins (saved in this browser) ---------------- */
const LS = 'run-coach-v1';
let LOG = { days: {}, moves: {} };
try { LOG = JSON.parse(localStorage.getItem(LS)) || LOG; } catch (e) {}
LOG.days ||= {}; LOG.moves ||= {};
const saveLog = () => { try { localStorage.setItem(LS, JSON.stringify(LOG)); } catch (e) {} };

/* ---------------- fitness prediction ---------------- */
function predictHM(runs, upTo, days = 56) {
  let best = null;
  for (const r of runs) {
    const age = diffD(r.day, upTo);
    if (age < 0 || age > days || r.distance_km < 5) continue;
    const t = r.moving_time_s * Math.pow(21.0975 / r.distance_km, 1.06);   // Riegel formula
    if (!best || t < best.t) best = { t, run: r };
  }
  return best;
}

/* ---------------- 1. build the base plan ---------------- */
function buildPlan(runs, today) {
  const C = COACH, race = C.raceDate, start = mondayOf(C.planStart);
  const before = runs.filter(r => r.day < start);
  const baseWeekly = Math.max(12, before.filter(r => diffD(r.day, start) <= 28).reduce((s, r) => s + r.distance_km, 0) / 4);
  const longest = Math.max(5, ...before.filter(r => diffD(r.day, start) <= 42).map(r => r.distance_km));

  const pred = predictHM(runs, today);
  const target = C.targetTime === 'auto' ? (pred ? Math.floor(pred.t / 60) * 60 : hms('2:15:00')) : hms(C.targetTime);
  const P = target / 21.0975;
  const pace = { easyLo: P * 1.15, easyHi: P * 1.25, tempo: P * 0.965, interval: P * 0.94, race: P };
  const fp = fmtPace;
  const easyText = `Easy pace ${fp(pace.easyLo)}–${fp(pace.easyHi)} /km. You should be able to talk in full sentences.`;

  const raceDetail = `Goal ${fmtDur(target)} = ${fp(P)} /km. Run the first 2 km 5–10 s/km slower than goal, settle in, and push from 16 km.`;
  const longDow = DOW.indexOf(C.longRunDay);
  const runDows = C.runDays.map(d => DOW.indexOf(d)).filter(d => d >= 0).sort((a, b) => a - b);
  const circ = (a, b) => Math.min((a - b + 7) % 7, (b - a + 7) % 7);
  const qualDow = runDows.filter(d => d !== longDow).sort((a, b) => circ(b, longDow) - circ(a, longDow) || a - b)[0];

  // weeks + phases (based on how far each week's long run is from race day)
  const weeks = [];
  for (let m = start; m <= race; m = addD(m, 7)) {
    const dtr = diffD(addD(m, longDow), race);
    weeks.push({ monday: m, phase: dtr <= 0 ? 'race' : dtr <= 7 ? 'final' : dtr <= 14 ? 'taper' : dtr <= 21 ? 'peak' : 'build' });
  }
  const build = weeks.filter(w => w.phase === 'build');
  build.forEach((w, i) => { w.bi = i; w.down = i % 4 === 3; w.p = build.length > 1 ? i / (build.length - 1) : 1; });
  const k = build.filter(w => !w.down).length;
  const Lstart = clamp(r05(longest + 1), 6, 14);
  const Lpeak = Math.max(Lstart, Math.min(19, Lstart + 2 * k));
  let j = 0, prevLong = Lstart;
  build.forEach(w => {
    w.long = w.down ? r05(prevLong * 0.75) : r05(Lstart + (Lpeak - Lstart) * j++ / Math.max(1, k));
    if (!w.down) prevLong = w.long;
  });
  const e0 = clamp(baseWeekly * 0.22, 4, 8);

  const sessions = [];
  const S = (date, type, hard, km, title, detail, phase) => sessions.push({ date, type, hard, km: type === 'race' ? 21.1 : r05(Math.max(2, km)), title, detail, phase });

  for (const w of weeks) {
    const easyF = w.phase === 'build' ? (w.down ? 0.8 : Math.min(1.35, 1 + 0.06 * w.bi)) : { peak: 1.15, taper: 0.75, final: 0.6, race: 0.6 }[w.phase];
    let easyCount = 0;
    for (const dw of runDows) {
      const date = addD(w.monday, dw), dtr = diffD(date, race);
      if (dtr < 0 || dtr === 2) continue;
      if (dtr === 0) { S(date, 'race', true, 21.1, 'Race day: Half marathon', raceDetail, 'race'); continue; }
      if (dtr === 1) { S(date, 'easy', false, 3, 'Shakeout', '3 km very easy plus 4 × 15 s strides. Lay out your race kit tonight.', 'final'); continue; }
      const ph = w.phase === 'race' ? 'final' : w.phase;

      if (dw === longDow) {
        if (ph === 'build') {
          const rpFinish = !w.down && w.p >= 0.6;
          S(date, 'long', true, w.long, w.down ? 'Long run (shorter week)' : 'Long run',
            `${easyText}${rpFinish ? ` Run the last 3 km at race pace ${fp(pace.race)} /km.` : ''}${w.long >= 15 ? ' Bring water.' : ''}`, ph);
        } else if (ph === 'peak') S(date, 'long', true, Lpeak, 'Peak long run', `${easyText} Run the last 4 km at race pace ${fp(pace.race)} /km. Practise your race-day drink and gel.`, ph);
        else if (ph === 'taper') S(date, 'long', true, Math.max(8, Lpeak * 0.65), 'Long run (taper)', easyText, ph);
        else S(date, 'long', false, Math.min(8, Lpeak * 0.45), 'Easy medium run', easyText, ph);
      } else if (dw === qualDow) {
        if (ph === 'build' && w.down) S(date, 'quality', false, e0 * 0.9, 'Easy run + strides', `${easyText} Finish with 6 × 20 s strides (fast but relaxed).`, ph);
        else if (ph === 'build') {
          const kind = ['interval', 'tempo', 'race'][w.bi % 3];
          if (kind === 'interval') { const reps = 4 + Math.round(2 * w.p); S(date, 'quality', true, 4 + reps + (reps - 1) * 0.3, 'Intervals', `2 km easy, then ${reps} × 1 km at ${fp(pace.interval)} /km with 2 min easy jog between, then 2 km easy.`, ph); }
          if (kind === 'tempo') { const t = r05(4 + 3 * w.p); S(date, 'quality', true, 4 + t, 'Tempo run', `2 km easy, ${t} km at ${fp(pace.tempo)} /km (comfortably hard), 2 km easy.`, ph); }
          if (kind === 'race') { const n = w.p > 0.5 ? 3 : 2; S(date, 'quality', true, 4 + 2 * n + (n - 1), 'Race-pace session', `2 km easy, ${n} × 2 km at race pace ${fp(pace.race)} /km with 1 km easy between, 2 km easy.`, ph); }
        }
        else if (ph === 'peak') S(date, 'quality', true, 11, 'Race-pace session', `2 km easy, 2 × 3 km at race pace ${fp(pace.race)} /km with 1 km easy between, 2 km easy.`, ph);
        else if (ph === 'taper') S(date, 'quality', true, 9, 'Race-pace sharpener', `2 km easy, 3 × 1.5 km at ${fp(pace.race)} /km with 2 min jog, 2 km easy.`, ph);
        else S(date, 'quality', true, 7, 'Race-pace tune-up', `2 km easy, 3 × 1 km at ${fp(pace.race)} /km with 2 min jog, 1.5 km easy. Should feel easy and controlled.`, ph);
      } else {
        S(date, 'easy', false, Math.max(3, e0 * easyF * (easyCount++ ? 0.85 : 1)), 'Easy run', easyText, ph);
      }
    }
  }
  if (!sessions.some(s => s.type === 'race')) S(race, 'race', true, 21.1, 'Race day: Half marathon', raceDetail, 'race');
  sessions.sort((a, b) => a.date < b.date ? -1 : 1);
  return { sessions, weeks, race, start, target, pace, pred, easyText, longest, baseWeekly };
}

/* ---------------- 2. adapt the plan to what actually happened ---------------- */
function healthState(today) {
  for (let i = 0; i <= 2; i++) {
    const d = addD(today, -i), f = LOG.days[d]?.feel;
    if (!f) continue;
    if (i === 0 || f === 'sick' || f === 'pain') return { feel: f, date: d, age: i };
    return {};
  }
  return {};
}

function adapt(ctx, runs, today, depth = 0) {
  const { race } = ctx, days = LOG.days, moves = LOG.moves, msgs = [];
  let S = ctx.sessions.map(s => ({ ...s, status: 'planned', notes: [] }));

  // apply moves you (or the coach) made earlier
  for (const [from, to] of Object.entries(moves)) {
    const src = S.find(s => s.date === from && !s.movedIn);
    if (!src) continue;
    src.status = 'moved';
    if (to === 'drop') { src.notes.push('Skipped, not made up'); continue; }
    src.notes.push(`Moved to ${fmtDay(to)}`);
    S = S.filter(s => !(s.date === to && !s.movedIn && !s.hard));
    S.push({ ...src, date: to, status: 'planned', notes: [`Moved from ${fmtDay(from)}`], movedIn: true });
  }
  S.sort((a, b) => a.date < b.date ? -1 : 1);

  // match Strava runs to sessions
  const runsBy = {};
  runs.forEach(r => { if (r.day <= today) (runsBy[r.day] ||= []).push(r); });
  const planned = new Set(S.filter(s => s.status !== 'moved').map(s => s.date));
  const used = new Set();
  const sumKm = rs => rs.reduce((a, r) => a + r.distance_km, 0);
  for (const s of S) {
    if (s.date > today || s.status === 'moved') continue;
    const rs = runsBy[s.date] || [], L = days[s.date] || {};
    if (rs.length) { rs.forEach(r => used.add(r)); s.actualKm = sumKm(rs); s.status = s.actualKm >= 0.7 * s.km ? 'done' : 'partial'; }
    else if (L.status === 'done') s.status = 'done';
    else if (L.status === 'skip') s.status = 'missed';
    else if (s.date < today) {
      for (const off of [-1, 1]) {
        const d = addD(s.date, off);
        if (d > today || planned.has(d)) continue;
        const rr = (runsBy[d] || []).filter(r => !used.has(r));
        if (rr.length) { rr.forEach(r => used.add(r)); s.actualKm = sumKm(rr); s.status = 'done'; s.notes.push(`Run on ${fmtDay(d)} instead`); break; }
      }
      if (s.status === 'planned') s.status = 'missed';
    }
  }

  // days since your last run
  const runDays = runs.filter(r => r.day <= today).map(r => r.day)
    .concat(Object.keys(days).filter(d => days[d].status === 'done' && d <= today)).sort();
  const lastRun = runDays[runDays.length - 1];
  const gap = lastRun ? diffD(lastRun, today) : 99;
  const health = healthState(today);
  const blocked = health.feel === 'sick' || health.feel === 'pain';

  // newly missed key sessions -> find a new day (or drop), remember the decision
  let changed = false;
  for (const s of S) {
    if (s.status !== 'missed' || s.movedIn || moves[s.date] || !s.hard || s.type === 'race') continue;
    if (diffD(s.date, today) > 3) continue;
    const slot = (blocked || gap >= 5 || diffD(s.date, race) <= 14) ? null : findSlot(S, s, today, race);
    moves[s.date] = slot || 'drop'; changed = true;
  }
  if (changed && depth < 3) { saveLog(); return adapt(ctx, runs, today, depth + 1); }

  const future = () => S.filter(s => s.status === 'planned' && s.date >= today);
  const toEasy = (s, f, why) => {
    if (s.type === 'race') return;
    s.km = r05(Math.max(3, s.km * f));
    if (s.hard) { s.title = s.type === 'long' ? 'Long run, all easy' : 'Easy run'; s.detail = ctx.easyText; }
    s.hard = false; s.adjusted = true; s.notes.push(why);
  };
  const shorten = (s, f, why) => { s.km = r05(Math.max(3, s.km * f)); s.adjusted = true; s.notes.push(why); };
  const rest = (s, why) => { s.status = 'rest'; s.adjusted = true; s.notes.push(why); };

  // build long runs gradually: never more than +2.5 km over the longest recent run
  let longMax = Math.max(6, ...runs.filter(r => r.day <= today && diffD(r.day, today) <= 28).map(r => r.distance_km));
  for (const s of future()) if (s.type === 'long' && (s.phase === 'build' || s.phase === 'peak')) {
    const cap = r05(longMax + 2.5);
    if (s.km > cap) { s.notes.push(`Shortened from ${s.km} km so your long runs build up gradually`); s.km = cap; s.adjusted = true; }
    longMax = Math.max(longMax, s.km);
  }

  // how you feel
  const F = future(), todayS = F.find(s => s.date === today);
  if (health.feel === 'pain' || health.feel === 'sick') {
    const restUntil = addD(health.date, 2);
    F.filter(s => s.date <= restUntil && s.type !== 'race').forEach(s => rest(s, health.feel === 'pain' ? 'Rest: pain or injury' : 'Rest: you’re sick'));
    future().slice(0, health.feel === 'pain' ? 3 : 2).forEach(s => toEasy(s, health.feel === 'pain' ? 0.7 : 0.6, 'Easy return after time off'));
    msgs.push(health.feel === 'pain'
      ? '<b>Pain or injury:</b> rest for 3 days, then come back with easy runs only. If it still hurts when walking, or you start to limp, see a physio before running again.'
      : '<b>Sick (fever, chest, or body aches):</b> rest until you’ve had 24 hours without fever, then ease back in with short easy runs.');
  } else if (todayS && health.age === 0) {
    if (health.feel === 'cold') {
      toEasy(todayS, 0.5, 'Head cold: short and easy, or rest if you feel worse once you start');
      F.filter(s => s !== todayS && s.hard && diffD(today, s.date) <= 3).slice(0, 1).forEach(s => toEasy(s, 0.8, 'Easing off while the cold clears'));
      msgs.push('<b>Head cold:</b> if it’s only above the neck (runny nose, sore throat), a short easy run is fine. Stop if you feel worse after 10 minutes.');
    }
    if (health.feel === 'sore') { todayS.hard ? toEasy(todayS, 0.7, 'Sore legs: easy today') : shorten(todayS, 0.7, 'Sore legs: a bit shorter today'); msgs.push('<b>Sore legs:</b> today is easy and shorter. Light soreness usually fades after an easy jog; sharp or one-sided pain does not, so stop if it gets worse.'); }
    if (health.feel === 'tired') {
      if (todayS.hard && todayS.type !== 'race') {
        const swap = F.find(s => s.date > today && !s.hard && mondayOf(s.date) === mondayOf(today) && s.type !== 'long');
        if (swap) {
          for (const f of ['type', 'hard', 'km', 'title', 'detail']) [todayS[f], swap[f]] = [swap[f], todayS[f]];
          todayS.adjusted = swap.adjusted = true;
          todayS.notes.push(`Swapped with ${fmtDay(swap.date)}: you’re tired`); swap.notes.push(`Swapped from ${fmtDay(today)}`);
          msgs.push(`<b>Tired:</b> today is an easy run instead. The workout moves to ${fmtDay(swap.date)}.`);
        } else { toEasy(todayS, 0.8, 'Tired: easy today'); msgs.push('<b>Tired:</b> today’s workout becomes an easy run. One easy day won’t hurt your fitness; pushing through fatigue can.'); }
      } else { shorten(todayS, 0.8, 'Tired: a bit shorter today'); msgs.push('<b>Tired:</b> keep today short and easy. Prioritise sleep tonight.'); }
    }
  }

  // time off
  if (today >= ctx.start && !blocked) {
    const within = d => s => diffD(today, s.date) < d;
    if (gap >= 15) {
      future().filter(within(7)).forEach(s => s.hard ? toEasy(s, 0.6, 'Comeback week after a long break') : shorten(s, 0.6, 'Comeback week after a long break'));
      msgs.push(`<b>${gap} days since your last run.</b> This week is a comeback week: everything easy and shorter. Some fitness has been lost, so consider setting a slower target time in the settings.`);
    } else if (gap >= 8) {
      future().filter(within(7)).forEach(s => s.hard ? toEasy(s, 0.75, 'Easing back in after a week off') : shorten(s, 0.8, 'Easing back in after a week off'));
      msgs.push(`<b>${gap} days since your last run.</b> The next 7 days are easy and a bit shorter. You haven’t lost much fitness yet, so don’t try to make up the missed kilometres.`);
    } else if (gap >= 5) {
      const h = future().find(s => s.hard && s.type !== 'race');
      if (h) toEasy(h, 0.85, 'Easy first run back after a few days off');
      msgs.push(`<b>${gap} days since your last run.</b> Your next workout is now an easy run to get back into rhythm.`);
    }
  }

  // never two hard days in a row
  const seq = S.filter(s => (s.status === 'planned' && s.date >= today) || (s.status === 'done' && s.hard && s.date === addD(today, -1)))
    .sort((a, b) => a.date < b.date ? -1 : 1);
  for (let i = 1; i < seq.length; i++) {
    const a = seq[i - 1], b = seq[i];
    if (diffD(a.date, b.date) !== 1 || !a.hard || !b.hard) continue;
    const bIsKey = b.type === 'long' || b.type === 'race';
    if (!bIsKey && b.status === 'planned') toEasy(b, 1, 'Made easy: no hard days back to back');
    else if (a.status === 'planned' && a.type !== 'race' && a.type !== 'long') toEasy(a, 1, 'Made easy: no hard days back to back');
    else if (b.type === 'long') toEasy(b, 1, 'Keep it all easy: hard session the day before');
  }

  // explain recent misses
  for (const s of S) {
    if (diffD(s.date, today) > 7 || s.date > today) continue;
    if (s.status === 'moved' && moves[s.date] && moves[s.date] !== 'drop') msgs.push(`<b>Missed ${s.title.toLowerCase()} on ${fmtDay(s.date)}.</b> Moved to ${fmtDay(moves[s.date])}. Nearby sessions were adjusted so you don’t do two hard days in a row.`);
    else if (s.status === 'moved') msgs.push(`<b>Missed ${s.title.toLowerCase()} on ${fmtDay(s.date)}.</b> There’s no safe day to fit it in, so skip it. Don’t add the kilometres to later runs.${s.type === 'long' ? ' Your next long run is capped so the build-up stays gradual.' : ''}`);
    else if (s.status === 'missed' && !s.hard) msgs.push(`Missed the easy run on ${fmtDay(s.date)}. No need to make it up.`);
  }
  return { S, msgs, gap, health };
}

function findSlot(S, s, today, race) {
  const at = d => S.find(x => x.date === d && x.status !== 'moved');
  const weekEnd = addD(mondayOf(s.date), 6);
  const first = s.date === today ? addD(today, 1) : (s.date < today ? today : addD(s.date, 1));
  for (let d = addD(s.date, 1); diffD(s.date, d) <= 3; d = addD(d, 1)) {
    if (d < first) continue;
    if (s.type !== 'long' && d > weekEnd) break;
    if (diffD(d, race) <= 14) break;
    if (LOG.days[d]?.status === 'skip') continue;
    const here = at(d);
    if (here && (here.hard || here.status !== 'planned')) continue;
    const near = [at(addD(d, -1)), at(addD(d, 1))];
    if (near.some(x => x && (x.type === 'long' || x.type === 'race') && x.status !== 'missed')) continue;
    if (near[0] && near[0].hard && near[0].status === 'done') continue;
    return d;
  }
  return null;
}

/* ---------------- 3. render the coach ---------------- */
const FEELS = [['great', 'Great'], ['tired', 'Tired'], ['sore', 'Sore legs'], ['cold', 'Head cold'], ['sick', 'Fever or chest'], ['pain', 'Pain or injury']];
const PHASE = { build: 'Build', down: 'Recovery week', peak: 'Peak', taper: 'Taper', final: 'Final taper', race: 'Race week' };
const STATUS = { done: '✓ Done', partial: '◐ Partial', missed: '✗ Missed', moved: '→ Moved', rest: '– Rest', planned: '' };

function renderCoach() {
  const today = TODAY;
  const ctx = buildPlan(ALL, today);
  const { S, msgs } = adapt(ctx, ALL, today);
  const daysToRace = diffD(today, ctx.race);
  const tS = S.find(s => s.date === today && s.status !== 'moved');
  const L = LOG.days[today] || {};
  const feelNow = L.feel;

  // this week
  const mon = mondayOf(today);
  const wk = S.filter(s => mondayOf(s.date) === mon && s.status !== 'moved');
  const wkPlanned = wk.filter(s => s.status !== 'rest').reduce((a, s) => a + s.km, 0);
  const wkDone = ALL.filter(r => r.day >= mon && r.day <= today).reduce((a, r) => a + r.distance_km, 0);
  const last14 = S.filter(s => s.date < today && diffD(s.date, today) <= 14 && ['done', 'partial', 'missed', 'moved'].includes(s.status));
  const comp = last14.length ? Math.round(100 * last14.filter(s => s.status === 'done' || s.status === 'partial').length / last14.length) : null;

  const predTxt = ctx.pred ? fmtDur(ctx.pred.t) : '–';
  const P = ctx.pace;

  let todayHtml;
  if (daysToRace < 0) todayHtml = `<div class="kicker">Race done</div><div class="title">Recovery time</div><div class="detail">Easy runs or rest for a week. Then set a new race date at the top of index.html.</div>`;
  else if (!tS && S.find(s => s.date === today && s.status === 'moved')) {
    const to = LOG.moves[today];
    todayHtml = `<div class="kicker">Today · ${fmtDay(today)} · Skipped</div><div class="title">No run today</div>
      <div class="detail">${to && to !== 'drop' ? `Today’s session moved to ${fmtDay(to)}. Check “Next 7 days” for the updated plan.` : 'Today’s session is skipped. Don’t try to make up the kilometres later.'}</div>
      ${L.status ? '<div class="actions"><button class="btn" data-act="undo">Undo</button></div>' : ''}`;
  }
  else if (!tS) todayHtml = `<div class="kicker">Today · ${fmtDay(today)}</div><div class="title">Rest day</div><div class="detail">Recovery is when the training sinks in. A walk or some light stretching is fine.</div>`;
  else {
    const st = tS.status;
    todayHtml = `<div class="kicker">Today · ${fmtDay(today)}${st === 'done' ? ' · ✓ Done' : st === 'missed' ? ' · Skipped' : st === 'rest' ? ' · Rest' : ''}</div>
      <div class="title">${st === 'rest' ? 'Rest' : `${tS.title} · ${tS.km} km`}</div>
      <div class="detail">${st === 'rest' ? 'Your body needs this rest. Training will adjust around it.' : tS.detail}</div>
      ${tS.notes.map(n => `<div class="adj">↻ ${esc(n)}</div>`).join('')}
      <div class="actions">
        ${st === 'planned' ? `<button class="btn primary" data-act="done">✓ I did it</button><button class="btn" data-act="skip">I can’t run today</button>` : ''}
        ${(L.status && st !== 'planned') ? `<button class="btn" data-act="undo">Undo</button>` : ''}
        ${tS.actualKm ? `<span class="sub">Synced from Strava: ${tS.actualKm.toFixed(2)} km</span>` : ''}
      </div>`;
  }

  const next = S.filter(s => s.date > today && diffD(today, s.date) <= 7 && s.status !== 'moved');

  // whole plan by week
  const weeksHtml = ctx.weeks.map((w, i) => {
    const ss = S.filter(s => mondayOf(s.date) === w.monday);
    const km = ss.filter(s => !['moved', 'rest'].includes(s.status)).reduce((a, s) => a + s.km, 0);
    const label = w.down ? PHASE.down : PHASE[w.phase];
    const isNow = w.monday === mon;
    return `<details class="week" ${isNow ? 'open' : ''}>
      <summary><span><span class="w">Week ${i + 1}</span> <span class="m">· ${pd(w.monday).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} · ${label}${isNow ? ' · this week' : ''}</span></span><span class="m">${km.toFixed(1)} km</span></summary>
      <table><tbody>${ss.map(s => `<tr>
        <td style="width:110px">${fmtDay(s.date)}</td>
        <td><b>${esc(s.title)}</b>${s.status === 'moved' ? '' : ` · ${s.km} km`}${s.notes.map(n => `<div class="adj">↻ ${esc(n)}</div>`).join('')}</td>
        <td class="num"><span class="st ${s.date === today && s.status === 'planned' ? 'today' : s.status}">${s.date === today && s.status === 'planned' ? 'Today' : STATUS[s.status]}</span></td>
      </tr>`).join('')}</tbody></table>
    </details>`;
  }).join('');

  $('#coach').innerHTML = `
    <div class="tiles">
      <div class="card tile"><div class="label">Race day</div><div class="value">${Math.max(0, daysToRace)}<span class="unit">days</span></div><div class="hint">${fmtDay(ctx.race)}</div></div>
      <div class="card tile"><div class="label">Target</div><div class="value">${fmtDur(ctx.target)}</div><div class="hint">${fmtPace(P.race)} /km${COACH.targetTime === 'auto' ? ' · auto' : ''}</div></div>
      <div class="card tile"><div class="label">Current fitness</div><div class="value">${predTxt}</div><div class="hint">Predicted from your fastest recent run</div></div>
      <div class="card tile"><div class="label">This week</div><div class="value">${wkDone.toFixed(1)}<span class="unit">/ ${wkPlanned.toFixed(0)} km</span></div><div class="hint">${comp === null ? 'Sessions done: –' : `Sessions done (last 2 weeks): ${comp}%`}</div></div>
    </div>
    <div class="grid2">
      <div class="card today">
        ${todayHtml}
        <div class="feel-label">How do you feel today?</div>
        <div class="feel">${FEELS.map(([k, l]) => `<button class="pill ${feelNow === k ? 'on' : ''}" data-feel="${k}">${l}</button>`).join('')}</div>
      </div>
      <div class="card">
        <h2>Coach says</h2>
        ${msgs.length ? `<ul class="notes">${msgs.map(m => `<li>${m}</li>`).join('')}</ul>` : `<ul class="notes"><li>${comp === null || comp >= 80 ? 'You’re on track. Keep easy runs truly easy and hit the key sessions.' : 'A few sessions were missed recently. That’s fine; just stay consistent this week.'}</li></ul>`}
        <div class="paces">
          <span>Easy <b>${fmtPace(P.easyLo)}–${fmtPace(P.easyHi)}</b></span>
          <span>Tempo <b>${fmtPace(P.tempo)}</b></span>
          <span>Intervals <b>${fmtPace(P.interval)}</b></span>
          <span>Race <b>${fmtPace(P.race)}</b></span>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Next 7 days</h2>
        ${next.length ? next.map(s => `<div class="next-row"><div class="d">${fmtDay(s.date)}</div>
          <div><div class="t">${s.status === 'rest' ? 'Rest' : esc(s.title)}</div><div class="x">${s.status === 'rest' ? '' : s.detail}</div>${s.notes.map(n => `<div class="adj">↻ ${esc(n)}</div>`).join('')}</div>
          <div class="k">${s.status === 'rest' ? '' : s.km + ' km'}</div></div>`).join('') : '<div class="sub">Nothing planned.</div>'}
      </div>
      <div class="card"><h2>Full plan</h2>${weeksHtml}
        <div class="foot">Your check-ins are saved in this browser only. Runs from Strava sync every few hours, so tap “I did it” to see changes straight away.</div>
      </div>
    </div>`;
}

$('#coach').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = (LOG.days[TODAY] ||= {});
  if (b.dataset.act === 'done') d.status = 'done';
  if (b.dataset.act === 'skip') d.status = 'skip';
  if (b.dataset.act === 'undo') { delete d.status; delete LOG.moves[TODAY]; }
  if (b.dataset.feel) {
    const f = b.dataset.feel;
    d.feel = d.feel === f ? undefined : f;
    // clearing sick/pain shouldn't leave stale "dropped" decisions for today
  }
  saveLog(); renderCoach();
});

/* ---------------- load data ---------------- */
fetch('runs.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    ALL = data.map(r => ({ ...r, day: r.date.slice(0, 10), d: new Date(r.date.replace('Z', '')), pace: r.moving_time_s / r.distance_km }))
              .filter(r => r.distance_km > 0)
              .sort((a, b) => b.d - a.d);
    if (ALL.length) $('#updated').textContent = `Latest run: ${fmtDate(ALL[0].d)}`;
    renderCoach();
    render();
  })
  .catch(err => { console.error(err); $('#coach').innerHTML = $('#content').innerHTML = '<div class="card msg">Couldn’t load runs.json. Run the “Sync runs” workflow first.</div>'; });

$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  range = b.dataset.range; render();
});

/* ---------------- stats dashboard ---------------- */
function decodePolyline(str) {
  let i = 0, lat = 0, lng = 0; const out = [];
  while (i < str.length) {
    for (const k of [0, 1]) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}

function render() {
  if (!ALL.length) { $('#content').innerHTML = '<div class="card msg">No runs found yet.</div>'; return; }
  const cutoff = range === 'all' ? new Date(0) : new Date(Date.now() - range * DAY);
  const runs = ALL.filter(r => r.d >= cutoff);
  const totalKm = runs.reduce((s, r) => s + r.distance_km, 0);
  const totalS = runs.reduce((s, r) => s + r.moving_time_s, 0);
  const longest = runs.reduce((m, r) => r.distance_km > (m?.distance_km || 0) ? r : m, null);
  const best = min => runs.filter(r => r.distance_km >= min).reduce((m, r) => !m || r.pace < m.pace ? r : m, null);
  const pbs = [['Fastest ≥ 5 km', best(5)], ['Fastest ≥ 10 km', best(10)], ['Fastest ≥ 21.1 km', best(21.1)]];

  $('#content').innerHTML = `
    <div class="tiles">
      ${tile('Distance', totalKm.toFixed(1), 'km')}${tile('Runs', runs.length, '')}
      ${tile('Time', fmtDur(totalS), '')}${tile('Avg pace', runs.length ? fmtPace(totalS / totalKm) : '–', '/km')}
    </div>
    <div class="grid2">
      <div class="card"><h2>Weekly distance (km)</h2><div class="chart"><canvas id="weekly"></canvas></div></div>
      <div class="card"><h2>Pace per run (min/km, faster is higher)</h2><div class="chart"><canvas id="pace"></canvas></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Average heart rate per run (bpm)</h2><div class="chart"><canvas id="hr"></canvas></div></div>
      <div class="card"><h2 id="mapTitle">Route</h2><div id="map"></div></div>
    </div>
    <div class="card" style="margin-bottom:12px"><h2>Bests in this period</h2>
      <div class="pb">${pbs.map(([l, r]) => pbCell(l, r ? fmtPace(r.pace) + ' /km' : '–', r)).join('')}
        ${pbCell('Longest run', longest ? longest.distance_km.toFixed(2) + ' km' : '–', longest)}</div>
    </div>
    <div class="card"><h2>Runs</h2><div class="scroll"><table>
      <thead><tr><th>Date</th><th>Name</th><th class="num">Distance</th><th class="num">Time</th><th class="num">Pace</th><th class="num">Avg HR</th><th class="num">Elev</th></tr></thead>
      <tbody id="rows">${runs.slice(0, 50).map((r, i) => `
        <tr data-i="${i}"><td>${fmtDate(r.d)}</td><td>${esc(r.name)}</td>
        <td class="num">${r.distance_km.toFixed(2)} km</td><td class="num">${fmtDur(r.moving_time_s)}</td>
        <td class="num">${fmtPace(r.pace)}</td><td class="num">${r.avg_hr ? Math.round(r.avg_hr) : '–'}</td>
        <td class="num">${Math.round(r.elev_m)} m</td></tr>`).join('')}</tbody>
    </table></div></div>`;

  drawCharts(runs);
  drawMap(runs[0], 0);
  $('#rows').addEventListener('click', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    drawMap(runs[+tr.dataset.i], +tr.dataset.i);
    $('#map').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}
const tile = (l, v, u) => `<div class="card tile"><div class="label">${l}</div><div class="value">${v}<span class="unit">${u}</span></div></div>`;
const pbCell = (l, v, r) => `<div><div class="label">${l}</div><div class="value">${v}</div><div class="when">${r ? fmtDate(r.d) : ''}</div></div>`;

function drawCharts(runs) {
  charts.forEach(c => c.destroy()); charts = [];
  const series = css('--series'), grid = css('--grid');
  Chart.defaults.color = css('--text-2');
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const base = {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { displayColors: false, padding: 10 } },
    scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 6, maxRotation: 0 } }, y: { grid: { color: grid }, border: { display: false } } }
  };
  const weeks = new Map();
  if (runs.length) {
    const first = weekStart(runs[runs.length - 1].d), last = weekStart(new Date());
    for (let w = new Date(first); w <= last; w.setDate(w.getDate() + 7)) weeks.set(w.getTime(), 0);
    runs.forEach(r => { const k = weekStart(r.d).getTime(); weeks.set(k, (weeks.get(k) || 0) + r.distance_km); });
  }
  const wk = [...weeks.entries()];
  charts.push(new Chart($('#weekly'), {
    type: 'bar',
    data: { labels: wk.map(([k]) => new Date(+k).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })),
      datasets: [{ data: wk.map(([, v]) => +v.toFixed(1)), backgroundColor: series, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'start', maxBarThickness: 24 }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { title: i => 'Week of ' + i[0].label, label: i => i.raw + ' km' } } } }
  }));
  const chrono = [...runs].reverse();
  const line = (canvas, values, yOpts, label) => new Chart(canvas, {
    type: 'line',
    data: { labels: chrono.map(r => r.d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })),
      datasets: [{ data: values, borderColor: series, backgroundColor: series, borderWidth: 2, pointRadius: 3, pointHoverRadius: 6, tension: 0.25, spanGaps: true }] },
    options: { ...base, interaction: { mode: 'index', intersect: false },
      scales: { ...base.scales, y: { ...base.scales.y, ...yOpts } },
      plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { title: i => chrono[i[0].dataIndex].name + ' · ' + i[0].label, label: i => label(i.raw, chrono[i.dataIndex]) } } } }
  });
  charts.push(line($('#pace'), chrono.map(r => r.pace), { reverse: true, ticks: { callback: v => fmtPace(v) } }, (v, r) => `${fmtPace(v)} /km · ${r.distance_km.toFixed(2)} km`));
  charts.push(line($('#hr'), chrono.map(r => r.avg_hr ? Math.round(r.avg_hr) : null), {}, (v, r) => `${v} bpm · ${fmtPace(r.pace)} /km`));
}

function drawMap(run, i = 0) {
  if (map) { map.remove(); map = null; }
  document.querySelectorAll('#rows tr').forEach(tr => tr.classList.toggle('sel', +tr.dataset.i === i));
  if (!run) return;
  $('#mapTitle').textContent = `Route · ${run.name} (${fmtDate(run.d)})`;
  const pts = run.polyline ? decodePolyline(run.polyline) : [];
  if (!pts.length) { $('#map').innerHTML = '<div class="msg">No GPS route for this run.</div>'; return; }
  map = L.map('map', { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  const pl = L.polyline(pts, { color: css('--series'), weight: 4 }).addTo(map);
  map.fitBounds(pl.getBounds(), { padding: [20, 20] });
}
</script>
</body>
</html>
